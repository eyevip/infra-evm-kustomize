apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpfpm
spec:
  template:
    spec:
      initContainers:
        # DB host and port are used
        - name: wait-for-db
          envFrom:
            - configMapRef:
                name: eyevip-cfg
      containers:
        - name: phpfpm
          envFrom:
            - configMapRef:
                name: mariadb-config
            - configMapRef:
                name: eyevip-cfg
            - secretRef:
                name: mariadb-secret
