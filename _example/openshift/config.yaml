# Keys must match the env names in the image's instance config.json
# (DB: constants `_hostname`, `_dbuser`, `_dbpass`, `_dbname`, `_dbport`).
# Some images read e.g. DB_DATABASE instead of DB_NAME.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eyevip-cfg
data:
  SERVER_URL: https://eyevip.apps-crc.testing # url will be used in EMails
  DB_HOST: mariadb # Service name of mariadb, not a pod name
  DB_PORT: "3306"
  LOG_LEVEL: debug
  EVM_ADDRESS: '{"address": "evm-graphql:3060"}' # service-name of evmgraphql-deployment
  REDIS_URL: tcp://redis:6379?auth=NEW_SECURE_REDIS_PASS

  EYEVIP_PASSWORD: SECURE_PASS # initial password for 'eyevipadmin'
